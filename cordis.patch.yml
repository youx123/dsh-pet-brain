# ============================================================================
# dsh-pet-brain 的 bundle patch —— 把这只桌宠挂进 DSH 配置树
# ============================================================================
#
# - insert：往配置树里加一行插件
# - id 必须全局唯一（这里与包名一致），否则会与别的插件的行标识冲突
# - name: 'dsh-pet-brain' 解析到包入口 lib/index.js（宿主半侧）
# - package.json 声明了 dsh.client，DSH 的模块系统会同时把本包扫描成浏览器插件，
#   按 exports['./client'] 提供 /plugins/dsh-pet-brain/client.js
#
# 注意：插件行那一行（"id: 值"）不要写行尾注释。
# ============================================================================

- insert:
    - id: dsh-pet-brain
      name: 'dsh-pet-brain'
